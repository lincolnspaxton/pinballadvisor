name: Refresh machine data

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 9:17 UTC (about 3am Mountain)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull from OPDB (Match Play export)
        run: node scripts/refresh-data.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh machine data from OPDB"
          git push
